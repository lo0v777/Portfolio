services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: react-client
    expose:
      - "80"
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"  
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  
    depends_on:
      - client
    networks:
      - app-network

networks:
  app-network:
    driver: bridge